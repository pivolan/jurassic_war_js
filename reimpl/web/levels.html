<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurassic War — levels</title>
<style>
  /* Оформление под игру: фон — кусок камня с экрана выбора клана, заголовок — логотип с
     титульного экрана, цвета взяты из MAIN.PAL (жёлтый 252,252,72 и красный 204,44,28). */
  :root { --ink:#fcfc48; --ink2:#cc2c1c; --dim:#8d8274; --edge:#2a2420; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; min-height:100%; background:#0b0908 url(../../ui/icons/bg.png) repeat;
    color:var(--ink); font:14px/1.35 ui-monospace,Menlo,Consolas,monospace; }
  /* поверх камня — затемнение, иначе текст на нём не читается */
  body::before { content:''; position:fixed; inset:0; background:rgba(8,6,5,.55); pointer-events:none; z-index:-1; }
  body { padding:18px 12px 40px; }
  header { text-align:center; margin:6px 0 22px; }
  header img { width:min(420px,80vw); image-rendering:pixelated; }
  header p { margin:10px 0 0; color:#cbbfa8; font-size:12px; text-shadow:1px 1px 2px #000; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:1000px; margin:0 auto; }
  @media (max-width:860px) { .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:420px) { .grid { grid-template-columns:1fr; } }
  .tribe { background:rgba(10,8,6,.86); border:1px solid #3a3229; border-radius:10px; padding:12px 10px 14px; text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.04); }
  .tribe .icon { height:74px; display:flex; align-items:flex-end; justify-content:center; }
  .tribe .icon img { max-height:74px; image-rendering:pixelated; filter:drop-shadow(0 2px 3px #000); }
  .tribe h2 { margin:8px 0 2px; font-size:15px; color:var(--ink2); text-shadow:1px 1px 0 #000; letter-spacing:.5px; }
  .tribe .unit { margin:0 0 10px; font-size:11px; color:#9c9080; min-height:28px; }
  .levels { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
  .levels a { display:block; padding:8px 0; text-decoration:none; color:var(--ink); background:#1b1712;
    border:1px solid var(--edge); border-radius:5px; font-size:13px; }
  .levels a:hover { background:var(--ink); color:#1b1712; border-color:var(--ink); }
  footer { text-align:center; margin-top:26px; color:#cbbfa8; font-size:11px; text-shadow:1px 1px 2px #000; }
  footer a { color:#fcfc48; }
  /* Переключатель сложности — каменная плашка того же вида, что карточки племён. */
  .diffbar { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    max-width:1000px; margin:0 auto 18px; padding:9px 14px;
    background:rgba(10,8,6,.86); border:1px solid #3a3229; border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.5) inset, 0 1px 0 rgba(255,255,255,.04); }
  .diffbar .lbl { color:var(--ink2); font-size:13px; letter-spacing:.5px; text-shadow:1px 1px 0 #000; }
  .seg { display:flex; gap:5px; }
  .seg button { font:inherit; font-size:13px; padding:8px 18px; cursor:pointer;
    color:var(--ink); background:#1b1712; border:1px solid var(--edge); border-radius:5px; }
  .seg button:hover { border-color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:#1b1712; border-color:var(--ink);
    box-shadow:0 0 8px rgba(252,252,72,.35); }
</style>
<div class="diffbar">
  <span class="lbl">Difficulty</span>
  <div class="seg" id="diff">
    <button data-d="easy" aria-pressed="false">easy</button>
    <button data-d="normal" aria-pressed="false">normal</button>
    <button data-d="hard" aria-pressed="false">hard</button>
  </div>
</div>
<header>
  <img src="../../ui/icons/title.png" alt="Jurassic War">
  <p>выбери племя и стадию кампании — откроется сразу брифинг</p>
</header>
<div class="grid" id="grid"></div>
<footer>12 стадий × 8 племён · сложность попадает прямо в ссылку: <b id="sample">?r=tyrano&amp;m=1&amp;d=normal</b> ·
  <a href="game.html">обычный запуск</a></footer>
<script>
// Фирменный юнит каждого племени выбран по картам кампании: у кого какие тренировочные здания
// и кого больше всего в стартовых расстановках (см. notes/TODO-shell.md).
// Версия значков: браузер держит png в кеше, и после перерисовки значка у всех оставался старый
// (у RaDumBa так и висел карнотавр). Поднимать при любой смене картинок в out/ui/icons.
const ЗНАЧКИ_В = 2;
const TRIBES = [
  { id:'tyrano',   name:'Tyrano',    unit:'Трицератопс' },
  { id:'kanoose',  name:'Ka-Noo-Se', unit:'Эльф-целитель' },
  { id:'romack',   name:'Romack',    unit:'Рейнджер: разведка и телепорт' },
  { id:'masai',    name:'Masai',     unit:'Воин в броне' },
  { id:'moospell', name:'Moospell',  unit:'Маг огня' },
  { id:'koomba',   name:'KoomBa',    unit:'Силач с топором' },
  { id:'radumba',  name:'RaDumBa',   unit:'Силач с огненным луком' },
  { id:'koaka',    name:'KoaKa',     unit:'Рамфоринх: летающий' },
];
document.getElementById('grid').innerHTML = TRIBES.map(t => `
  <div class="tribe">
    <div class="icon"><img src="../../ui/icons/${t.id}.png?v=${ЗНАЧКИ_В}" alt=""></div>
    <h2>${t.name}</h2>
    <p class="unit">${t.unit}</p>
    <div class="levels">${Array.from({length:12},(_,i)=>
      `<a data-race="${t.id}" data-lvl="${i+1}">${i+1}</a>`).join('')}</div>
  </div>`).join('');

// Сложность дописывается в ссылку третьим сегментом (/jw/<племя>/<уровень>/<сложность>) —
// её понимает и nginx, и сама страница игры (DIFF_BY_NAME в web/game.js). Выбор запоминается.
const DIFFS = ['easy', 'normal', 'hard'];
let diff = localStorage.getItem('jw.diff');
if (!DIFFS.includes(diff)) diff = 'normal';
function applyDiff() {
  localStorage.setItem('jw.diff', diff);
  for (const b of document.querySelectorAll('#diff button')) b.setAttribute('aria-pressed', String(b.dataset.d === diff));
  // Ссылка относительная: страница живёт и на <your host>/, и на <your site>/play/,
  // и просто из каталога reimpl/web — короткий вид /jw/<племя>/<стадия> есть только на rts.
  for (const a of document.querySelectorAll('.levels a')) a.href = `game.html?r=${a.dataset.race}&m=${a.dataset.lvl}&d=${diff}`;
  document.getElementById('sample').textContent = `?r=tyrano&m=1&d=${diff}`;
}
document.getElementById('diff').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  diff = b.dataset.d; applyDiff();
});
applyDiff();
</script>
</html>
