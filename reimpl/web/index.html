<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jurassic War JS</title>
<style>
  :root { --bg:#0e0d0b; --panel:#1b1815; --edge:#3a3229; --ink:#d8cfc2; --dim:#8d8274; --hot:#e8c07d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; }
  #hud { padding:4px 62px 4px 8px; color:var(--dim); font-size:11px; border-bottom:1px solid var(--edge);
         white-space:nowrap; overflow-x:auto; scrollbar-width:none; }
  #hud::-webkit-scrollbar { display:none; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:4px; }
  /* Размер канвы считает viewer.js (fit): так рамка элемента точно совпадает с картинкой 640×480
     и пересчёт координат в мышь остаётся точным — object-fit тут не годится, он даёт поля внутри элемента. */
  canvas { image-rendering:pixelated; display:block; background:#000; outline:none; touch-action:none; border:1px solid var(--edge); }
  canvas:focus { border-color:var(--hot); }
  #bar { border-top:1px solid var(--edge); background:var(--panel); padding:5px 6px calc(5px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:4px; }
  .row { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .lbl { color:var(--dim); font-size:10px; min-width:52px; }
  button { font:inherit; font-size:12px; color:var(--ink); background:#262119; border:1px solid var(--edge); border-radius:5px;
           padding:7px 9px; min-width:34px; cursor:pointer; user-select:none; touch-action:manipulation; }
  button:active { background:#3a3229; }
  button.on { background:var(--hot); color:#1b1815; border-color:var(--hot); }
  button.wide { min-width:56px; }
  #toggle { position:fixed; right:6px; top:4px; z-index:2; padding:3px 7px; font-size:11px; }
  body.hidebar #bar { display:none; }
  /* Телефон: кнопок много, места мало — жмём отступы и прячем подписи рядов. */
  @media (max-width: 560px) {
    button { padding:6px 6px; min-width:29px; font-size:11px; }
    button.wide { min-width:44px; }
    .lbl { min-width:0; font-size:9px; }
    .row { gap:3px; }
    #bar { padding:3px 4px calc(3px + env(safe-area-inset-bottom)); gap:3px; }
  }
</style>
<div id="hud">загрузка…</div>
<button id="toggle">кнопки</button>
<div id="stage"><canvas id="c" width="640" height="480"></canvas></div>
<div id="bar">
  <div class="row">
    <span class="lbl">мышь</span>
    <button class="wide" data-mb="0">ЛКМ</button><button class="wide" data-mb="2">ПКМ</button>
    <button id="latch" class="wide">зажать</button><button id="pmode" class="wide">тачпад</button>
    <button data-mod="ShiftLeft">Shift</button><button data-mod="ControlLeft">Ctrl</button><button data-mod="AltLeft">Alt</button>
    <span class="lbl" id="phint" style="min-width:0"></span>
  </div>
  <div class="row">
    <span class="lbl">команды</span>
    <button data-key="KeyA">A идти</button><button data-key="KeyZ">Z отдых</button><button data-key="KeyG">G охрана</button>
    <button data-key="KeyN">N след.</button><button data-key="Space">центр</button><button data-key="Tab">инфо</button>
    <button data-key="Backquote">` карта</button><button data-key="NumpadAdd">+ статы</button><button data-key="KeyP">пауза</button>
  </div>
  <div class="row">
    <span class="lbl">группы</span>
    <button data-key="Digit1">1</button><button data-key="Digit2">2</button><button data-key="Digit3">3</button><button data-key="Digit4">4</button>
    <button data-key="Digit5">5</button><button data-key="Digit6">6</button><button data-key="Digit7">7</button><button data-key="Digit8">8</button>
    <button data-key="Digit9">9</button><button data-key="Digit0">0</button>
  </div>
  <div class="row">
    <span class="lbl">экран</span>
    <button data-key="Escape">Esc</button><button data-key="F1">F1</button><button data-key="F2">F2</button><button data-key="F3">F3</button><button data-key="F4">F4</button>
    <button data-key="F5">F5</button><button data-key="F6">F6</button><button data-key="F7">F7</button><button data-key="F8">F8</button>
    <button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button>
  </div>
  <div class="row">
    <span class="lbl">симуляция</span>
    <button id="run" class="wide">▶ пуск</button><button id="stepb" class="wide">шаг</button><button id="fs" class="wide">во весь экран</button>
  </div>
</div>
